# Render Blueprint for the Acme Plumbing stack.
#
# UNTESTED-UNTIL-FIRST-DEPLOY: field names match Render's current Blueprint
# spec, but you will likely adjust plan names, regions, and the generated
# *.onrender.com hostnames on the first push. See deploy/README.md.
#
# Provisions: managed Postgres + the FastAPI API (from the Dockerfile) + n8n
# (official image with a persistent disk). pgAdmin is intentionally omitted —
# use Render's database dashboard or connect a local client to the DB's
# external URL.
#
# Prereqs in the repo: the Dockerfile binds $PORT (done), and migrations/ is
# present. The API's preDeployCommand applies 001_initial_schema.sql idempotently
# — that needs `psql` in the image; see deploy/README.md for the one-line add.

databases:
  - name: acme-postgres
    databaseName: acme_marketing
    user: acme
    plan: free                       # bump to 'starter' for anything real

services:
  # ── FastAPI backend (system of record) ──────────────────────────────
  - type: web
    name: acme-api
    runtime: docker
    rootDir: acme-plumbing-backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # Idempotent migration before each deploy (requires psql in the image).
    preDeployCommand: >-
      sh -c 'psql "$DATABASE_URL" -tAc "SELECT to_regclass('"'"'public.brands'"'"')" | grep -q brands
      || psql "$DATABASE_URL" -f migrations/001_initial_schema.sql'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme-postgres
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: INTERNAL_API_TOKEN
        generateValue: true          # Render generates + stores a secret
      - key: CORS_ORIGINS
        value: https://acme-n8n.onrender.com
      - key: DEFAULT_TIMEZONE
        value: America/New_York
      # Provider secrets — set values in the Render dashboard, never in git.
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_BASE_URL
        value: https://api.brevo.com/v3
      - key: GATEWAYAPI_API_TOKEN
        sync: false
      - key: GATEWAYAPI_BASE_URL
        value: https://gatewayapi.com/rest

  # ── n8n orchestration (own SQLite on a persistent disk) ──────────────
  - type: web
    name: acme-n8n
    runtime: image
    plan: starter                    # n8n needs a disk; free plans can't attach one
    image:
      url: docker.io/n8nio/n8n:latest
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n      # SQLite DB + encryption key persist here
      sizeGB: 1
    envVars:
      - key: N8N_HOST
        value: acme-n8n.onrender.com
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PORT
        value: "5678"
      - key: WEBHOOK_URL
        value: https://acme-n8n.onrender.com/
      - key: GENERIC_TIMEZONE
        value: America/New_York
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true          # fixed secret; regenerating breaks saved creds
      # Workflow variables ($env.* inside the imported workflows):
      - key: API_BASE_URL
        value: https://acme-api.onrender.com
      - key: INTERNAL_API_TOKEN
        fromService:
          name: acme-api
          type: web
          envVarKey: INTERNAL_API_TOKEN   # same token the API expects
      - key: DEFAULT_BRAND_SLUG
        value: acme-plumbing
      - key: DEFAULT_TIMEZONE
        value: America/New_York
      - key: REVIEW_REQUEST_DELAY_MINUTES
        value: "120"
      - key: REMINDER_LEAD_HOURS
        value: "24"
