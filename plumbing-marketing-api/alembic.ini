# Alembic configuration. The database URL is NOT set here — env.py loads it from
# app settings (DATABASE_URL) and derives a sync psycopg DSN for migrations.

[alembic]
script_location = migrations
prepend_sys_path = .
# Revision filenames: 0001_initial_schema.py, 0002_xxx.py, ...
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[post_write_hooks]
# (optional) enable a formatter on generated revisions, e.g.:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
